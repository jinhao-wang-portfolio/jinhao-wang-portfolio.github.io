<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jinhao Wang</title>

    <!-- 方案 C：解密档案旧铅字库 (Noto Serif SC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=11">
    <link rel="stylesheet" href="installation/undercarriage.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>


<body>

    <!-- 方案 C 定制：4.0px 粗粝炭棒石墨滤镜 -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
        <filter id="pencil-texture">
            <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.0" xChannelSelector="R" yChannelSelector="G" result="displaced" />
            <feComposite in="displaced" in2="noise" operator="arithmetic" k1="0.25" k2="0.8" k3="0" k4="0" />
        </filter>
    </svg>

    <!-- ========================================
         SITE NAVIGATION
         ======================================== -->

    <header class="site-header">

        <nav>
            <a href="index.html">HOME</a>
            <a href="works.html">WORKS</a>
            <a href="about.html">ABOUT</a>
        </nav>

    </header>


    <!-- ========================================
         HOME PAGE (HERO)
         ======================================== -->

    <main class="home">

        <section class="hero">

            <!-- Hero Image -->
            <div class="hero-image">
                <img
                    src="images/digital collage/home-hero-small.jpg"
                    alt="Jinhao Wang"
                >
            </div>

            <!-- Hero Text -->
            <div class="hero-text">
                <h1>Jinhao Wang</h1>
                <p>
                    于我而言，创作就是吃什么拉什么的过程，<br>
                    它应该日常化，应该关注我们摄入了什么。
                </p>
            </div>

        </section>

    </main>


    <!-- ========================================
         INSTALLATION: METABOLISM CONVEYOR (第二屏：代谢流水线装置)
         ======================================== -->

    <section class="installation-section">

        <div class="stage-container">

            <!-- 左侧进料消隐机身 -->
            <div class="intake-apparatus">
                <!-- 贴紧 10px 进料碎片 -->
                <div class="geometric-shards">
                    <div class="shard shard-1"></div>
                    <div class="shard shard-2"></div>
                    <div class="shard shard-3"></div>
                </div>

                <!-- 阔口浅盘漏斗 (87px 宽 / 16px 深) -->
                <div class="hopper-top"></div>

                <!-- 机颈与三颗微铆钉 -->
                <div class="machine-neck">
                    <div class="rivet"></div>
                    <div class="rivet"></div>
                    <div class="rivet"></div>
                </div>

                <!-- 底座与贴轨输出口 (60px 高 / 0px 间隙) -->
                <div class="machine-base">
                    <div class="output-gate"></div>
                </div>
            </div>

            <!-- 4px 发丝级微轨与双端 [X] 轮 -->
            <div class="conveyor-assembly" id="conveyor-assembly">
                <div class="belt-track">
                    <div class="belt-texture"></div>
                </div>

                <!-- 左端 [X] 轮 -->
                <div class="wheel-hub wheel-left">
                    <svg viewBox="0 0 40 40">
                        <line x1="9" y1="9" x2="31" y2="31" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <line x1="31" y1="9" x2="9" y2="31" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <circle cx="20" cy="20" r="2.5" fill="currentColor"/>
                    </svg>
                </div>

                <!-- 右端 [X] 轮 -->
                <div class="wheel-hub wheel-right">
                    <svg viewBox="0 0 40 40">
                        <line x1="9" y1="9" x2="31" y2="31" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <line x1="31" y1="9" x2="9" y2="31" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <circle cx="20" cy="20" r="2.5" fill="currentColor"/>
                    </svg>
                </div>

                <!-- 方块文字输送滑轨通道 -->
                <div class="track-runway" id="track-runway"></div>
            </div>

        </div>

    </section>


    <!-- ========================================
         SMART SLIDE HEADER SCRIPT
         ======================================== -->

    <script>
        const header = document.querySelector(".site-header");
        let lastScrollY = window.pageYOffset;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.pageYOffset;

            if (currentScrollY <= 80) {
                header.classList.remove("header-hidden");
                lastScrollY = currentScrollY;
                return;
            }

            if (Math.abs(currentScrollY - lastScrollY) < 10) {
                return;
            }

            if (currentScrollY > lastScrollY) {
                header.classList.add("header-hidden");
            } else {
                header.classList.remove("header-hidden");
            }

            lastScrollY = currentScrollY;
        }, { passive: true });
    </script>

    <!-- 侧视流水线代谢推进逻辑 -->
    <script src="installation/undercarriage.js"></script>

</body>

</html>
